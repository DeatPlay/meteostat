<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Čtečka váhy</title>
  <!-- Tesseract.js načtený z CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #121212; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Zaměřovací rámeček na displej váhy */
    .roi-box {
      position: absolute;
      width: 240px;
      height: 90px;
      border: 3px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .roi-box::before {
      content: 'Namiř na displej';
      position: absolute;
      top: -24px;
      left: 0;
      font-size: 13px;
      color: #00ff88;
      font-weight: 600;
    }

    /* Panel s výsledkem */
    #control-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff88;
    }

    .status {
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

    /* Skrytý canvas pro předzpracování */
    #cropCanvas { display: none; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="roi-box" id="roi"></div>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="0" readonly>
      <span style="font-size: 20px; font-weight: bold;">g</span>
    </div>
    <div class="status" id="statusText">Inicializace...</div>
  </div>

  <canvas id="cropCanvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const roi = document.getElementById('roi');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');

    let worker = null;
    let isProcessing = false;

    // 1. Spuštění zadní kamery
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusText.innerText = "Načítám OCR model...";
        initOCR();
      } catch (err) {
        statusText.innerText = "Chyba kamery: " + err.message;
      }
    }

    // 2. Inicializace Tesseract Workeru (nastavený jen na číslice)
    async function initOCR() {
      try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789.-', // Ignoruje písmena, hledá jen čísla a tečky
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE // Očekáváme jeden řádek textu
        });
        statusText.innerText = "Skenuji...";
        startScanningLoop();
      } catch (err) {
        statusText.innerText = "Chyba OCR: " + err.message;
      }
    }

    // 3. Oříznutí a prahování výřezu na černobílou
    function captureAndPreprocess() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const cRect = video.getBoundingClientRect();
      const rRect = roi.getBoundingClientRect();

      // Přepočet souřadnic rámečku na reálné rozlišení videa
      const scaleX = vWidth / cRect.width;
      const scaleY = vHeight / cRect.height;

      const sx = (rRect.left - cRect.left) * scaleX;
      const sy = (rRect.top - cRect.top) * scaleY;
      const sWidth = rRect.width * scaleX;
      const sHeight = rRect.height * scaleY;

      canvas.width = rRect.width;
      canvas.height = rRect.height;

      // Vykreslení oříznutého výřezu
      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

      // Binarizace: Převod na tvrdou černobílou (odstraní stíny a odlesky váhy)
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const threshold = 110; // Práh pro LCD: tmavé segmenty vs světlé pozadí

      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        // Pokud je displej tmavý se svítícími čísly, obrať nerovnost (> threshold)
        const val = avg < threshold ? 0 : 255;
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // 4. Neustálá smyčka snímání
    function startScanningLoop() {
      setInterval(async () => {
        if (isProcessing || !worker || video.readyState !== 4) return;

        isProcessing = true;
        captureAndPreprocess();

        try {
          const { data: { text } } = await worker.recognize(canvas);
          const cleanVal = text.replace(/[^0-9.-]/g, '').trim();

          if (cleanVal.length > 0 && !isNaN(cleanVal)) {
            weightInput.value = cleanVal;
            statusText.innerText = "Úspěšně přečteno";
          }
        } catch (e) {
          console.error(e);
        } finally {
          isProcessing = false;
        }
      }, 400); // Kontrola každých 400 ms
    }

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
