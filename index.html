<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Čtečka váhy (Foto na spoušť)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Rámeček pouze na zelené pole */
    .roi-box {
      position: absolute;
      width: 230px;
      height: 55px;
      border: 2px solid #00ff88;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    .roi-box::before {
      content: 'Namiř pouze na zelené pole';
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      color: #00ff88;
      font-weight: 600;
      white-space: nowrap;
    }

    #preview-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      border: 1px solid #444;
      background: #000;
      padding: 3px;
      border-radius: 4px;
      text-align: center;
      z-index: 5;
    }

    #preview-container span {
      display: block;
      font-size: 9px;
      color: #888;
      margin-bottom: 2px;
    }

    #cropCanvas {
      width: 130px;
      height: auto;
      display: block;
    }

    #control-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff88;
    }

    button#snapBtn {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      background: #00ff88;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button#snapBtn:active {
      transform: scale(0.98);
    }

    button#snapBtn:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="roi-box" id="roi"></div>

    <div id="preview-container">
      <span>ZACHYCENÝ VÝŘEZ</span>
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="0.00" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>

    <button id="snapBtn" disabled>Načítám OCR...</button>

    <div class="status" id="statusText">Inicializace...</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const roi = document.getElementById('roi');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');
    const snapBtn = document.getElementById('snapBtn');

    let worker = null;
    let isProcessing = false;

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Připravuji OCR jádro...";
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789', // Hledá výhradně čísla
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });

        statusText.innerText = "Připraveno. Namiřte a stiskněte tlačítko.";
        snapBtn.innerText = "VYFOTIT A PŘEČÍST";
        snapBtn.disabled = false;
      } catch (err) {
        statusText.innerText = "Chyba inicializace: " + err.message;
      }
    }

    async function captureAndRead() {
      if (isProcessing || !worker || video.readyState !== 4) return;

      isProcessing = true;
      snapBtn.disabled = true;
      snapBtn.innerText = "Čtu displej...";
      statusText.innerText = "Zpracovávám snímek...";

      try {
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;
        const cRect = video.getBoundingClientRect();
        const rRect = roi.getBoundingClientRect();

        const scaleX = vWidth / cRect.width;
        const scaleY = vHeight / cRect.height;

        const sx = (rRect.left - cRect.left) * scaleX;
        const sy = (rRect.top - cRect.top) * scaleY;
        const sWidth = rRect.width * scaleX;
        const sHeight = rRect.height * scaleY;

        const w = 280;
        const h = 70;
        canvas.width = w;
        canvas.height = h;

        // Vykreslení ořezu
        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // 1. Prahování: černá čísla = 1, světlé pozadí = 0
        const bin = new Uint8Array(w * h);
        const threshold = 115;

        for (let i = 0; i < data.length; i += 4) {
          const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          bin[i / 4] = (gray < threshold) ? 1 : 0;
        }

        // 2. Čistě vertikální dilatace (dy = 3 px, dx = 0)
        // Spojí horní/střední/spodní čárky, ale nechá mezeru mezi číslicemi
        const dilated = new Uint8Array(w * h);
        const ry = 3;

        for (let y = ry; y < h - ry; y++) {
          for (let x = 0; x < w; x++) {
            if (bin[y * w + x] === 1) {
              for (let dy = -ry; dy <= ry; dy++) {
                dilated[(y + dy) * w + x] = 1;
              }
            }
          }
        }

        // 3. Vykreslení upraveného obrazu pro Tesseract
        for (let i = 0; i < dilated.length; i++) {
          const isDigit = dilated[i] === 1;
          const color = isDigit ? 0 : 255;
          const p = i * 4;
          data[p] = color;
          data[p + 1] = color;
          data[p + 2] = color;
          data[p + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);

        // 4. OCR vyhodnocení
        const { data: { text } } = await worker.recognize(canvas);
        const digits = text.replace(/\D/g, '');

        if (digits.length >= 3) {
          const firstThree = digits.substring(0, 3);
          const formatted = firstThree[0] + '.' + firstThree.substring(1);
          weightInput.value = formatted;
          statusText.innerText = `Přečteno: ${formatted} g`;
        } else if (digits.length > 0) {
          statusText.innerText = `Detekováno málo číslic (${digits}), zkuste znovu.`;
        } else {
          statusText.innerText = "Číslice nebyly nalezeny, zkuste zaostřit a kliknout znovu.";
        }
      } catch (err) {
        console.error(err);
        statusText.innerText = "Chyba při čtení: " + err.message;
      } finally {
        isProcessing = false;
        snapBtn.disabled = false;
        snapBtn.innerText = "VYFOTIT A PŘEČÍST";
      }
    }

    snapBtn.addEventListener('click', captureAndRead);
    window.addEventListener('load', init);
  </script>
</body>
</html>
