<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skenování váhy z fotky</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
    
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    /* Skrytý standardní input, nahrazený velkým tlačítkem */
    #fileInput { display: none; }
    .btn-camera {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #00ff88;
      color: #000;
      font-weight: 700;
      font-size: 18px;
      padding: 16px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .output-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      max-width: 200px;
      padding: 12px;
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #00ff88;
    }

    /* Náhled zpracování */
    canvas {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
      border: 1px solid #444;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: #aaa;
    }

    input[type="range"] { width: 100%; accent-color: #00ff88; }
    .status { text-align: center; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

  <label for="fileInput" class="btn-camera">
    📷 Vyfotit displej váhy
  </label>
  <input type="file" id="fileInput" accept="image/*" capture="environment">

  <div class="card">
    <div class="status" id="statusText">Připraveno. Vyfoť displej co nejblíže a rovně.</div>
    <div class="output-box">
      <input type="text" id="weightVal" placeholder="---" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <label for="thresholdSlider">Filtr kontrastu (práh): <span id="threshVal">128</span></label>
      <input type="range" id="thresholdSlider" min="30" max="220" value="128">
    </div>
    <canvas id="previewCanvas"></canvas>
    <div class="status" style="font-size: 12px;">Výše vidíš obraz, jak ho vidí OCR engine. Čísla musí být čistě černá na bílém podkladu (nebo naopak bez šedých fleků).</div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const weightVal = document.getElementById('weightVal');
    const statusText = document.getElementById('statusText');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const threshVal = document.getElementById('threshVal');

    let loadedImage = null;
    let worker = null;

    // 1. Inicializace Tesseractu na pozadí
    async function getWorker() {
      if (!worker) {
        statusText.innerText = "Načítám OCR model...";
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789.-',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });
      }
      return worker;
    }

    // 2. Načtení fotky z nativního foťáku
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.innerText = "Zpracovávám fotku...";
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        runProcessingAndOCR();
      };
      img.src = URL.createObjectURL(file);
    });

    // 3. Úprava kontrastu / Prahování
    function preprocess(threshold) {
      if (!loadedImage) return;

      // Zmenšíme příliš velkou fotku z mobilu (např. 4000px -> 800px šířka pro rychlost)
      const scale = Math.min(1, 800 / loadedImage.width);
      canvas.width = loadedImage.width * scale;
      canvas.height = loadedImage.height * scale;

      ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;

      // Binarizace: černá vs bílá
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const val = gray < threshold ? 0 : 255;
        d[i] = val;
        d[i + 1] = val;
        d[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // 4. Samotné OCR čtení
    async function runProcessingAndOCR() {
      const threshold = parseInt(thresholdSlider.value);
      threshVal.innerText = threshold;

      preprocess(threshold);
      statusText.innerText = "Rozpoznávám číslice...";

      try {
        const ocr = await getWorker();
        const { data: { text } } = await ocr.recognize(canvas);
        const clean = text.replace(/[^0-9.-]/g, '').trim();

        if (clean) {
          weightVal.value = clean;
          statusText.innerText = "Úspěšně rozpoznáno!";
        } else {
          statusText.innerText = "Číslo nenalezeno. Zkus posunout posuvník filtru.";
        }
      } catch (err) {
        statusText.innerText = "Chyba: " + err.message;
      }
    }

    // Změna posuvníku okamžitě přepočítá filtr i OCR
    thresholdSlider.addEventListener('input', () => {
      threshVal.innerText = thresholdSlider.value;
      preprocess(parseInt(thresholdSlider.value));
    });

    thresholdSlider.addEventListener('change', () => {
      runProcessingAndOCR();
    });
  </script>
</body>
</html>
