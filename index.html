<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ONNX Čtečka Váhy</title>
  <!-- Oficiální ONNX Runtime pro web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Rámeček zaměřený přesně na plochu se zeleným displejem */
    .roi-box {
      position: absolute;
      width: 230px;
      height: 65px;
      border: 2px solid #00ff88;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .roi-box::before {
      content: 'Namiř pouze na zelený displej s čísly';
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      color: #00ff88;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Náhled vstupu */
    #preview-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      border: 1px solid #444;
      background: #000;
      padding: 3px;
      border-radius: 4px;
      text-align: center;
    }

    #preview-container span {
      display: block;
      font-size: 9px;
      color: #888;
      margin-bottom: 2px;
    }

    #cropCanvas {
      width: 120px;
      height: auto;
      display: block;
    }

    #control-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff88;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="roi-box" id="roi"></div>

    <div id="preview-container">
      <span>AI VSTUP</span>
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="--.--" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>
    <div class="status" id="statusText">Inicializace AI a kamery...</div>
  </div>

  <!-- Pomocný skrytý canvas pro zmenšování číslice na 28x28 -->
  <canvas id="digitCanvas" width="28" height="28" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const roi = document.getElementById('roi');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const digitCanvas = document.getElementById('digitCanvas');
    const dCtx = digitCanvas.getContext('2d', { willReadFrequently: true });
    
    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');

    let session = null;
    let isProcessing = false;

    // URL lehkého ONNX modelu pro rozpoznávání číslic (spuštěno lokálně ve WebAssembly)
    const MODEL_URL = 'https://raw.githubusercontent.com/onnx/models/main/validated/vision/classification/mnist/model/mnist-8.onnx';

    async function init() {
      try {
        statusText.innerText = "Stahuji ONNX model (cca 80 kB)...";
        // Nastavení ort prostředí
        ort.env.wasm.numThreads = 1;
        session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ['wasm'] });

        statusText.innerText = "Spouštím kameru...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Model načten. Namiřte na displej.";
        startProcessingLoop();
      } catch (err) {
        statusText.innerText = "Chyba inicializace: " + err.message;
        console.error(err);
      }
    }

    function startProcessingLoop() {
      setInterval(async () => {
        if (isProcessing || !session || video.readyState !== 4) return;
        isProcessing = true;
        try {
          await processFrame();
        } catch (e) {
          console.error(e);
        } finally {
          isProcessing = false;
        }
      }, 200); // 5 kontrol za sekundu
    }

    async function processFrame() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const cRect = video.getBoundingClientRect();
      const rRect = roi.getBoundingClientRect();

      const scaleX = vWidth / cRect.width;
      const scaleY = vHeight / cRect.height;

      const sx = (rRect.left - cRect.left) * scaleX;
      const sy = (rRect.top - cRect.top) * scaleY;
      const sWidth = rRect.width * scaleX;
      const sHeight = rRect.height * scaleY;

      canvas.width = 240;
      canvas.height = 70;

      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // 1. Prahování: černá čísla -> bílé číslice na černém pozadí (přesně jak vyžaduje MNIST model)
      const binary = new Uint8Array(canvas.width * canvas.height);
      const threshold = 115;

      for (let i = 0; i < data.length; i += 4) {
        const avg = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        const isDigitPixel = avg < threshold ? 1 : 0;
        const pixelIdx = i / 4;
        binary[pixelIdx] = isDigitPixel;

        // Vizualizace pro náhled (bílé číslice na černém pozadí)
        const v = isDigitPixel ? 255 : 0;
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      // 2. Nalezení sloupců s aktivními pixely (detekce jednotlivých číslic a tečky)
      const colDensity = new Array(canvas.width).fill(0);
      for (let x = 0; x < canvas.width; x++) {
        let count = 0;
        for (let y = 6; y < canvas.height - 6; y++) {
          if (binary[y * canvas.width + x] === 1) count++;
        }
        colDensity[x] = count;
      }

      const segments = [];
      let inBlock = false;
      let startX = 0;

      for (let x = 8; x < canvas.width - 8; x++) {
        if (colDensity[x] >= 3) {
          if (!inBlock) {
            inBlock = true;
            startX = x;
          }
        } else {
          if (inBlock) {
            inBlock = false;
            const w = x - startX;
            if (w >= 3) segments.push({ x: startX, w: w });
          }
        }
      }

      if (segments.length === 0) return;

      let detectedString = '';

      for (let seg of segments) {
        // Ignorovat jednotku 'g' a drobné symboly v pravém rohu
        if (seg.x > canvas.width * 0.82 && seg.w < 16) continue;

        // Detekce desetinné tečky podle malé šířky u paty displeje
        if (seg.w <= 10) {
          let dotHits = 0;
          for (let y = Math.floor(canvas.height * 0.65); y < canvas.height - 6; y++) {
            for (let x = seg.x; x < seg.x + seg.w; x++) {
              if (binary[y * canvas.width + x] === 1) dotHits++;
            }
          }
          if (dotHits >= 3) detectedString += '.';
          continue;
        }

        // Číslice: zmenšení na 28x28 a inference modelem
        const digit = await runInferenceOnDigit(seg.x, seg.w);
        if (digit !== null) {
          detectedString += digit;
        }
      }

      // Validace čísla (např. 93.91)
      if (detectedString.length >= 2 && !isNaN(parseFloat(detectedString))) {
        weightInput.value = detectedString;
        statusText.innerText = "Přečteno: " + detectedString + " g";
      }
    }

    async function runInferenceOnDigit(x, w) {
      dCtx.fillStyle = '#000';
      dCtx.fillRect(0, 0, 28, 28);

      // Centrování vyříznuté číslice do čtverce 28x28 s okrajem
      const padding = 4;
      const targetH = 28 - (padding * 2);
      const scale = targetH / canvas.height;
      const targetW = Math.min(28 - (padding * 2), Math.floor(w * scale));
      const offsetX = Math.floor((28 - targetW) / 2);

      dCtx.drawImage(canvas, x, 0, w, canvas.height, offsetX, padding, targetW, targetH);

      const img = dCtx.getImageData(0, 0, 28, 28);
      const d = img.data;

      // Příprava tenzoru [1, 1, 28, 28] normalizovaného do rozsahu [0.0, 1.0]
      const input = new Float32Array(28 * 28);
      for (let i = 0; i < d.length; i += 4) {
        input[i / 4] = d[i] / 255.0;
      }

      const tensor = new ort.Tensor('float32', input, [1, 1, 28, 28]);
      const feeds = { [session.inputNames[0]]: tensor };
      const results = await session.run(feeds);
      const output = results[session.outputNames[0]].data;

      // Nalezení argmax (číslice s nejvyšším skóre)
      let maxProb = -Infinity;
      let bestDigit = -1;
      for (let i = 0; i < 10; i++) {
        if (output[i] > maxProb) {
          maxProb = output[i];
          bestDigit = i;
        }
      }

      return bestDigit >= 0 ? bestDigit.toString() : null;
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
