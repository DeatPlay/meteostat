<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Čtečka váhy (Desetinná místa)</title>
  <!-- Tesseract.js v5 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Zaměřovací rámeček */
    .roi-box {
      position: absolute;
      width: 250px;
      height: 95px;
      border: 2px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .roi-box::before {
      content: 'Namiř na displej váhy';
      position: absolute;
      top: -24px;
      left: 0;
      font-size: 13px;
      color: #00ff88;
      font-weight: 600;
    }

    /* Náhled toho, co OCR skutečně vidí */
    #preview-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      border: 1px solid #444;
      background: #000;
      padding: 2px;
      border-radius: 4px;
      text-align: center;
    }

    #preview-container span {
      display: block;
      font-size: 10px;
      color: #888;
      margin-bottom: 2px;
    }

    #cropCanvas {
      width: 120px;
      height: auto;
      display: block;
      border-radius: 2px;
    }

    /* Spodní panel s naměřenou hodnotou */
    #control-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff88;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="roi-box" id="roi"></div>
    
    <!-- Náhled pro ladění prahování -->
    <div id="preview-container">
      <span>OCR VSTUP</span>
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="0.00" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>
    <div class="status" id="statusText">Inicializace kamery...</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const roi = document.getElementById('roi');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');

    let worker = null;
    let isProcessing = false;

    // 1. Spuštění zadní kamery s ideálním rozlišením
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusText.innerText = "Načítám OCR jádro...";
        initOCR();
      } catch (err) {
        statusText.innerText = "Chyba kamery: " + err.message;
      }
    }

    // 2. Příprava Tesseract workeru s podporou desetinných znaků
    async function initOCR() {
      try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789.,-', 
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });
        statusText.innerText = "Připraveno. Namiřte na displej.";
        startScanningLoop();
      } catch (err) {
        statusText.innerText = "Chyba OCR: " + err.message;
      }
    }

    // 3. Výřez a binarizace s 2x zvětšením pro zachycení desetinné tečky
    function captureAndPreprocess() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const cRect = video.getBoundingClientRect();
      const rRect = roi.getBoundingClientRect();

      const scaleX = vWidth / cRect.width;
      const scaleY = vHeight / cRect.height;

      const sx = (rRect.left - cRect.left) * scaleX;
      const sy = (rRect.top - cRect.top) * scaleY;
      const sWidth = rRect.width * scaleX;
      const sHeight = rRect.height * scaleY;

      // 2x upscaling pro ostřejší tečku/čárku
      const upscale = 2;
      canvas.width = Math.floor(rRect.width * upscale);
      canvas.height = Math.floor(rRect.height * upscale);

      // Vykreslení oříznutého úseku
      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

      // Černobílé prahování (binarizace)
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const threshold = 115; // Hodnota prahu: uprav pokud jsou číslice moc tenké nebo splývají

      for (let i = 0; i < data.length; i += 4) {
        // Luminanční vážený průměr
        const avg = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        
        // Klasický LCD displej: tmavé segmenty (0), světlé pozadí (255)
        const val = avg < threshold ? 0 : 255;
        
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // 4. Detekční smyčka
    function startScanningLoop() {
      setInterval(async () => {
        if (isProcessing || !worker || video.readyState !== 4) return;

        isProcessing = true;
        captureAndPreprocess();

        try {
          const { data: { text } } = await worker.recognize(canvas);
          
          // Očištění a sjednocení oddělovače na tečku
          let clean = text.replace(/[^0-9.,-]/g, '').trim();
          clean = clean.replace(',', '.');

          // Validace čísla (celé, desetinné, setinné)
          const match = clean.match(/^-?\d+(\.\d+)?$/);

          if (match) {
            const detectedValue = match[0];
            weightInput.value = detectedValue;
            statusText.innerText = `Přečteno: ${detectedValue} g`;
          }
        } catch (e) {
          console.error("Chyba při čtení snímku:", e);
        } finally {
          isProcessing = false;
        }
      }, 350); // Frekvence vyhodnocování (350 ms)
    }

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
