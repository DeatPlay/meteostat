<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Čtečka Váhy (AI Vision)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #111; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Rámeček na celou váhu */
    .target-zone {
      position: absolute;
      width: 280px;
      height: 370px;
      border: 2px dashed rgba(255, 255, 255, 0.35);
      border-radius: 16px;
      pointer-events: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .target-zone.aligned {
      border-color: #00ff88;
      border-style: solid;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .target-zone::after {
      content: 'ZAROVNEJ CELOU VÁHU SEM';
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
    }

    #overlaySvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #control-panel {
      padding: 16px;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      background: #262626;
      border: 1px solid #444;
      border-radius: 8px;
      color: #00ff88;
    }

    button#snapBtn {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      background: #00ff88;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button#snapBtn:active {
      transform: scale(0.98);
    }

    button#snapBtn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }

    #captureCanvas, #trackerCanvas { display: none; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    
    <div class="target-zone" id="targetZone"></div>

    <svg id="overlaySvg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#00ff88" />
        </marker>
      </defs>
      <!-- Přilepený rámeček k displeji -->
      <rect id="trackedScale" x="0" y="0" width="0" height="0" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-width="2" rx="8" style="display: none;" />
      <!-- Vodicí linie -->
      <line id="guideLine" x1="0" y1="0" x2="0" y2="0" stroke="#00ff88" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" style="display: none;" />
      <!-- Instrukce k pohybu -->
      <text id="guideText" x="0" y="0" fill="#00ff88" font-size="14" font-weight="bold" text-anchor="middle" style="display: none;"></text>
    </svg>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="--.--" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>

    <button id="snapBtn">VYFOTIT A PŘEČÍST PŘES AI</button>
    <div class="status" id="statusText">Inicializace...</div>
  </div>

  <canvas id="trackerCanvas" width="80" height="60"></canvas>
  <canvas id="captureCanvas"></canvas>

  <script>
    const GEMINI_API_KEY = "TVUJ_GEMINI_API_KEY";

    const video = document.getElementById('video');
    const targetZone = document.getElementById('targetZone');
    const trackerCanvas = document.getElementById('trackerCanvas');
    const tCtx = trackerCanvas.getContext('2d', { willReadFrequently: true });
    
    const captureCanvas = document.getElementById('captureCanvas');
    const cCtx = captureCanvas.getContext('2d');

    const trackedScale = document.getElementById('trackedScale');
    const guideLine = document.getElementById('guideLine');
    const guideText = document.getElementById('guideText');

    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');
    const snapBtn = document.getElementById('snapBtn');

    let isProcessing = false;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Namiřte na váhu.";
        startLiveTracking();
      } catch (err) {
        statusText.innerText = "Chyba kamery: " + err.message;
      }
    }

    // Detekce displeje (zelený i oranžový) + ověření černého rámečku
    function startLiveTracking() {
      setInterval(() => {
        if (video.readyState !== 4 || isProcessing) return;

        const tw = 80;
        const th = 60;
        tCtx.drawImage(video, 0, 0, tw, th);
        const data = tCtx.getImageData(0, 0, tw, th).data;

        let minX = tw, maxX = 0, minY = th, maxY = 0;
        let hits = 0;

        for (let y = 0; y < th; y++) {
          for (let x = 0; x < tw; x++) {
            const idx = (y * tw + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];

            // 1. Zelené LCD podsvícení
            const isGreenLCD = (g > 65 && g > r + 15 && g > b + 15);

            // 2. Oranžové / jantarové LCD podsvícení
            const isOrangeLCD = (r > 130 && g > 55 && g < r * 0.85 && b < 70 && (r - g) > 25);

            if (isGreenLCD || isOrangeLCD) {
              // 3. Kontrola černého krytu v okolí (černý plast pod a vedle displeje)
              let hasDarkNeighbor = false;
              for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++) {
                  const ny = y + dy;
                  const nx = x + dx;
                  if (nx >= 0 && nx < tw && ny >= 0 && ny < th) {
                    const nIdx = (ny * tw + nx) * 4;
                    const brightness = (data[nIdx] * 0.299 + data[nIdx + 1] * 0.587 + data[nIdx + 2] * 0.114);
                    if (brightness < 45) {
                      hasDarkNeighbor = true;
                      break;
                    }
                  }
                }
                if (hasDarkNeighbor) break;
              }

              if (hasDarkNeighbor) {
                hits++;
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
        }

        // Pokud je nalezena souvislá plocha displeje v černém rámu
        if (hits > 18 && (maxX - minX) > 4) {
          const cRect = video.getBoundingClientRect();
          const scaleX = cRect.width / tw;
          const scaleY = cRect.height / th;

          const dispX = cRect.left + minX * scaleX;
          const dispY = cRect.top + minY * scaleY;
          const dispW = (maxX - minX) * scaleX;
          const dispH = (maxY - minY) * scaleY;

          trackedScale.setAttribute('x', dispX);
          trackedScale.setAttribute('y', dispY);
          trackedScale.setAttribute('width', dispW);
          trackedScale.setAttribute('height', dispH);
          trackedScale.style.display = 'block';

          // Cílové umístění displeje v dolní části celého rámečku váhy
          const tRect = targetZone.getBoundingClientRect();
          const targetX = tRect.left + tRect.width / 2;
          const targetY = tRect.top + tRect.height * 0.72;

          const currX = dispX + dispW / 2;
          const currY = dispY + dispH / 2;

          const dx = targetX - currX;
          const dy = targetY - currY;
          const dist = Math.hypot(dx, dy);

          if (dist > 45) {
            targetZone.classList.remove('aligned');
            guideLine.setAttribute('x1', currX);
            guideLine.setAttribute('y1', currY);
            guideLine.setAttribute('x2', targetX);
            guideLine.setAttribute('y2', targetY);
            guideLine.style.display = 'block';

            let msg = 'Posuň ';
            if (Math.abs(dy) > 28) msg += dy > 0 ? 'níže ' : 'výše ';
            if (Math.abs(dx) > 28) msg += dx > 0 ? 'doprava' : 'doleva';

            guideText.setAttribute('x', currX);
            guideText.setAttribute('y', currY - 14);
            guideText.textContent = msg;
            guideText.style.display = 'block';
          } else {
            targetZone.classList.add('aligned');
            guideLine.style.display = 'none';
            guideText.setAttribute('x', currX);
            guideText.setAttribute('y', currY - 14);
            guideText.textContent = '✓ VÁHA ZAROVNÁNA';
            guideText.style.display = 'block';
          }
        } else {
          trackedScale.style.display = 'none';
          guideLine.style.display = 'none';
          guideText.style.display = 'none';
          targetZone.classList.remove('aligned');
        }
      }, 70);
    }

    // Vyfocení celé váhy a přečtení přes Vision API
    async function captureAndSendToAI() {
      if (isProcessing || video.readyState !== 4) return;

      if (!GEMINI_API_KEY || GEMINI_API_KEY === "TVUJ_GEMINI_API_KEY") {
        alert("Nejprve vložte svůj Gemini API klíč do proměnné GEMINI_API_KEY.");
        return;
      }

      isProcessing = true;
      snapBtn.disabled = true;
      snapBtn.innerText = "Analyzuji přes AI...";
      statusText.innerText = "Odesílám snímek do Vision AI...";

      try {
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;
        const cRect = video.getBoundingClientRect();
        const tRect = targetZone.getBoundingClientRect();

        const scaleX = vWidth / cRect.width;
        const scaleY = vHeight / cRect.height;

        const sx = (tRect.left - cRect.left) * scaleX;
        const sy = (tRect.top - cRect.top) * scaleY;
        const sw = tRect.width * scaleX;
        const sh = tRect.height * scaleY;

        captureCanvas.width = 420;
        captureCanvas.height = 540;
        cCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 420, 540);

        const base64Data = captureCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Přečti přesné číslo na displeji této kapesní váhy (LCD displej může být zelený, modrý i oranžový). Vrať POUZE číselnou hodnotu včetně případné desetinné tečky (např. 93.91, 5.45 nebo 0.00). Nevracej žádný další text, jednotky ani uvozovky." },
                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
              ]
            }]
          })
        });

        const result = await response.json();
        const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (aiText) {
          const cleanNum = aiText.replace(/[^0-9.,-]/g, '').replace(',', '.');
          weightInput.value = cleanNum;
          statusText.innerText = `AI načetla: ${cleanNum} g`;
        } else {
          statusText.innerText = "Hodnotu se nepodařilo přečíst, zkuste zaostřit a vyfotit znovu.";
        }
      } catch (err) {
        console.error(err);
        statusText.innerText = "Chyba API: " + err.message;
      } finally {
        isProcessing = false;
        snapBtn.disabled = false;
        snapBtn.innerText = "VYFOTIT A PŘEČÍST PŘES AI";
      }
    }

    snapBtn.addEventListener('click', captureAndSendToAI);
    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
