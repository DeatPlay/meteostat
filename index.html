<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Inteligentní čtečka váhy</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cílová zóna uprostřed obrazovky */
    .target-zone {
      position: absolute;
      width: 250px;
      height: 65px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      pointer-events: none;
    }

    .target-zone::after {
      content: 'CÍLOVÉ MÍSTO PRO DISPLEJ';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.4);
      white-space: nowrap;
    }

    /* Vektorová vrstva pro šipku a přilepený rámeček */
    #overlaySvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    #preview-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      border: 1px solid #444;
      background: #000;
      padding: 3px;
      border-radius: 4px;
      text-align: center;
      z-index: 5;
    }

    #preview-container span {
      display: block;
      font-size: 9px;
      color: #888;
      margin-bottom: 2px;
    }

    #cropCanvas {
      width: 120px;
      height: auto;
      display: block;
    }

    #control-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff88;
    }

    button#snapBtn {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      background: #00ff88;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button#snapBtn:active {
      transform: scale(0.98);
    }

    button#snapBtn:disabled {
      background: #444;
      color: #777;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    
    <!-- Cílové pole uprostřed -->
    <div class="target-zone" id="targetZone"></div>

    <!-- SVG plátno pro kreslení šipky a detekovaného rámečku -->
    <svg id="overlaySvg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#00ff88" />
        </marker>
      </defs>
      <!-- Rámeček přilepený na displej -->
      <rect id="trackedRect" x="0" y="0" width="0" height="0" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="2" rx="6" style="display: none;" />
      <!-- Naváděcí linie se šipkou -->
      <line id="guideLine" x1="0" y1="0" x2="0" y2="0" stroke="#00ff88" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" style="display: none;" />
      <!-- Text pokynu -->
      <text id="guideText" x="0" y="0" fill="#00ff88" font-size="13" font-weight="bold" text-anchor="middle" style="display: none;"></text>
    </svg>

    <div id="preview-container">
      <span>UPRAVENÝ VÝŘEZ</span>
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="0.00" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>

    <button id="snapBtn" disabled>Načítám OCR...</button>
    <div class="status" id="statusText">Spouštím kameru...</div>
  </div>

  <!-- Pomocný canvas pro tracker zelené plochy -->
  <canvas id="trackerCanvas" width="80" height="60" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const targetZone = document.getElementById('targetZone');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const trackerCanvas = document.getElementById('trackerCanvas');
    const tCtx = trackerCanvas.getContext('2d', { willReadFrequently: true });

    const overlaySvg = document.getElementById('overlaySvg');
    const trackedRect = document.getElementById('trackedRect');
    const guideLine = document.getElementById('guideLine');
    const guideText = document.getElementById('guideText');

    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');
    const snapBtn = document.getElementById('snapBtn');

    let worker = null;
    let isProcessing = false;
    let latestDisplayBox = null; // Souřadnice reálného displeje ve videu

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Připravuji OCR model...";
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });

        statusText.innerText = "Namiřte kameru na zelený displej váhy.";
        snapBtn.innerText = "VYFOTIT A PŘEČÍST";
        snapBtn.disabled = false;

        startTrackingLoop();
      } catch (err) {
        statusText.innerText = "Chyba: " + err.message;
      }
    }

    // Živý tracker: hledá zelenou skvrnu displeje a počítá naváděcí vektor
    function startTrackingLoop() {
      setInterval(() => {
        if (video.readyState !== 4 || isProcessing) return;

        const tw = 80;
        const th = 60;
        tCtx.drawImage(video, 0, 0, tw, th);
        const data = tCtx.getImageData(0, 0, tw, th).data;

        let minX = tw, maxX = 0, minY = th, maxY = 0;
        let hits = 0;

        // Hledání pixelů zeleného LCD
        for (let y = 0; y < th; y++) {
          for (let x = 0; x < tw; x++) {
            const idx = (y * tw + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];

            if (g > 65 && g > r + 16 && g > b + 16) {
              hits++;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        // Pokud je nalezena dostatečná plocha displeje
        if (hits > 25 && (maxX - minX) > 4 && (maxY - minY) > 2) {
          const cRect = video.getBoundingClientRect();
          const scaleX = cRect.width / tw;
          const scaleY = cRect.height / th;

          const screenX = cRect.left + minX * scaleX;
          const screenY = cRect.top + minY * scaleY;
          const screenW = (maxX - minX) * scaleX;
          const screenH = (maxY - minY) * scaleY;

          // Uložení boxu pro samotné vyfocení (v reálných video pixelech)
          const vidScaleX = video.videoWidth / tw;
          const vidScaleY = video.videoHeight / th;
          latestDisplayBox = {
            sx: minX * vidScaleX,
            sy: minY * vidScaleY,
            sw: (maxX - minX) * vidScaleX,
            sh: (maxY - minY) * vidScaleY
          };

          // Vykreslit rámeček přilepený k displeji
          trackedRect.setAttribute('x', screenX);
          trackedRect.setAttribute('y', screenY);
          trackedRect.setAttribute('width', screenW);
          trackedRect.setAttribute('height', screenH);
          trackedRect.style.display = 'block';

          // Cílové souřadnice středu
          const tRect = targetZone.getBoundingClientRect();
          const targetCenterX = tRect.left + tRect.width / 2;
          const targetCenterY = tRect.top + tRect.height / 2;

          // Aktuální střed displeje
          const currentCenterX = screenX + screenW / 2;
          const currentCenterY = screenY + screenH / 2;

          const dx = targetCenterX - currentCenterX;
          const dy = targetCenterY - currentCenterY;
          const dist = Math.hypot(dx, dy);

          if (dist > 35) {
            // Šipka ukazující směr posunu
            guideLine.setAttribute('x1', currentCenterX);
            guideLine.setAttribute('y1', currentCenterY);
            guideLine.setAttribute('x2', targetCenterX);
            guideLine.setAttribute('y2', targetCenterY);
            guideLine.style.display = 'block';

            let moveText = 'Posuňte telefon ';
            if (Math.abs(dy) > 25) moveText += dy > 0 ? 'níže ' : 'výše ';
            if (Math.abs(dx) > 25) moveText += dx > 0 ? 'doprava' : 'doleva';

            guideText.setAttribute('x', currentCenterX);
            guideText.setAttribute('y', currentCenterY - 12);
            guideText.textContent = moveText;
            guideText.style.display = 'block';

            snapBtn.style.background = '#444';
            snapBtn.style.color = '#888';
          } else {
            // Displej je perfektně v cílovém rámečku
            guideLine.style.display = 'none';
            guideText.setAttribute('x', currentCenterX);
            guideText.setAttribute('y', currentCenterY - 12);
            guideText.textContent = '✓ PERFEKTNÍ POZICE';
            guideText.style.display = 'block';

            snapBtn.style.background = '#00ff88';
            snapBtn.style.color = '#000';
          }
        } else {
          // Displej není vidět
          trackedRect.style.display = 'none';
          guideLine.style.display = 'none';
          guideText.style.display = 'none';
          latestDisplayBox = null;
          snapBtn.style.background = '#00ff88';
          snapBtn.style.color = '#000';
        }
      }, 70);
    }

    // Vyfocení s asymetrickou dilatací (horizontálně silněji, vertikálně jemně)
    async function captureAndRead() {
      if (isProcessing || !worker || video.readyState !== 4) return;

      isProcessing = true;
      snapBtn.disabled = true;
      snapBtn.innerText = "Čtu hodnotu...";
      statusText.innerText = "Zpracovávám snímek...";

      try {
        let sx, sy, sWidth, sHeight;

        // Pokud tracker displej našel, použijeme jeho přímý ořez, jinak středový rámeček
        if (latestDisplayBox && latestDisplayBox.sw > 30) {
          sx = latestDisplayBox.sx;
          sy = latestDisplayBox.sy;
          sWidth = latestDisplayBox.sw;
          sHeight = latestDisplayBox.sh;
        } else {
          const vWidth = video.videoWidth;
          const vHeight = video.videoHeight;
          const cRect = video.getBoundingClientRect();
          const tRect = targetZone.getBoundingClientRect();

          const scaleX = vWidth / cRect.width;
          const scaleY = vHeight / cRect.height;
          sx = (tRect.left - cRect.left) * scaleX;
          sy = (tRect.top - cRect.top) * scaleY;
          sWidth = tRect.width * scaleX;
          sHeight = tRect.height * scaleY;
        }

        const w = 280;
        const h = 70;
        canvas.width = w;
        canvas.height = h;

        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // 1. Prahování
        const bin = new Uint8Array(w * h);
        const threshold = 115;

        for (let i = 0; i < data.length; i += 4) {
          const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          bin[i / 4] = (gray < threshold) ? 1 : 0;
        }

        // 2. Asymetrická dilatace: HORIZONTÁLNĚ VÍCE (rx = 2), VERTIKÁLNĚ MÉNĚ (ry = 1)
        const dilated = new Uint8Array(w * h);
        const rx = 2; // silnější vodorovně
        const ry = 1; // jemně svisle

        for (let y = ry; y < h - ry; y++) {
          for (let x = rx; x < w - rx; x++) {
            if (bin[y * w + x] === 1) {
              for (let dy = -ry; dy <= ry; dy++) {
                for (let dx = -rx; dx <= rx; dx++) {
                  dilated[(y + dy) * w + (x + dx)] = 1;
                }
              }
            }
          }
        }

        // 3. Vykreslení do canvasu
        for (let i = 0; i < dilated.length; i++) {
          const isDigit = dilated[i] === 1;
          const color = isDigit ? 0 : 255;
          const p = i * 4;
          data[p] = color;
          data[p + 1] = color;
          data[p + 2] = color;
          data[p + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);

        // 4. OCR vyhodnocení
        const { data: { text } } = await worker.recognize(canvas);
        const digits = text.replace(/\D/g, '');

        if (digits.length >= 3) {
          const firstThree = digits.substring(0, 3);
          const formatted = firstThree[0] + '.' + firstThree.substring(1);
          weightInput.value = formatted;
          statusText.innerText = `Načteno: ${formatted} g`;
        } else if (digits.length > 0) {
          statusText.innerText = `Neúplný odpočet (${digits}), zkuste znovu s lepším zarovnáním.`;
        } else {
          statusText.innerText = "Číslice nerozpoznány, srovnejte displej do cílového pole.";
        }
      } catch (err) {
        console.error(err);
        statusText.innerText = "Chyba při čtení: " + err.message;
      } finally {
        isProcessing = false;
        snapBtn.disabled = false;
        snapBtn.innerText = "VYFOTIT A PŘEČÍST";
      }
    }

    snapBtn.addEventListener('click', captureAndRead);
    window.addEventListener('load', init);
  </script>
</body>
</html>
