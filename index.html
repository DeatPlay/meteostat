<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Morfologické OCR (Vertikální dilatace)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .roi-box {
      position: absolute;
      width: 230px;
      height: 55px;
      border: 2px solid #00ff88;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    .roi-box::before {
      content: 'Namiř pouze na zelené pole';
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      color: #00ff88;
      font-weight: 600;
      white-space: nowrap;
    }

    #preview-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      border: 1px solid #444;
      background: #000;
      padding: 3px;
      border-radius: 4px;
      text-align: center;
      z-index: 5;
    }

    #preview-container span {
      display: block;
      font-size: 9px;
      color: #888;
      margin-bottom: 2px;
    }

    #cropCanvas {
      width: 130px;
      height: auto;
      display: block;
    }

    #control-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .output-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff88;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="roi-box" id="roi"></div>

    <div id="preview-container">
      <span>VERTIKÁLNĚ SPOJENO</span>
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div class="output-group">
      <input type="text" id="weightInput" placeholder="--.--" readonly>
      <span style="font-size: 24px; font-weight: bold;">g</span>
    </div>
    <div class="status" id="statusText">Inicializace...</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const roi = document.getElementById('roi');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const weightInput = document.getElementById('weightInput');
    const statusText = document.getElementById('statusText');

    let worker = null;
    let isProcessing = false;

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Načítám OCR model...";
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789.,',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });

        statusText.innerText = "Skenuji displej...";
        startLoop();
      } catch (err) {
        statusText.innerText = "Chyba: " + err.message;
      }
    }

    function startLoop() {
      setInterval(async () => {
        if (isProcessing || !worker || video.readyState !== 4) return;
        isProcessing = true;
        try {
          processFrameAndRead();
        } catch (e) {
          console.error(e);
          isProcessing = false;
        }
      }, 400);
    }

    async function processFrameAndRead() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const cRect = video.getBoundingClientRect();
      const rRect = roi.getBoundingClientRect();

      const scaleX = vWidth / cRect.width;
      const scaleY = vHeight / cRect.height;

      const sx = (rRect.left - cRect.left) * scaleX;
      const sy = (rRect.top - cRect.top) * scaleY;
      const sWidth = rRect.width * scaleX;
      const sHeight = rRect.height * scaleY;

      // Zvýšené rozlišení (300x75) pomáhá udržet tečku zřetelnou
      const w = 300;
      const h = 75;
      canvas.width = w;
      canvas.height = h;

      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // 1. Prahování: černá čísla = 1, světlé pozadí = 0
      const bin = new Uint8Array(w * h);
      const threshold = 115;

      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        bin[i / 4] = (gray < threshold) ? 1 : 0;
      }

      // 2. Čistě vertikální dilatace:
      // ry = 3 (spojí vertikální mezery mezi segmenty)
      // rx = 0 (nulové horizontální roztažení -> zachová mezery kolem tečky)
      const dilated = new Uint8Array(w * h);
      const ry = 3;
      const rx = 0;

      for (let y = ry; y < h - ry; y++) {
        for (let x = 0; x < w; x++) {
          if (bin[y * w + x] === 1) {
            for (let dy = -ry; dy <= ry; dy++) {
              dilated[(y + dy) * w + x] = 1;
            }
          }
        }
      }

      // 3. Vykreslení upraveného obrazu pro OCR
      for (let i = 0; i < dilated.length; i++) {
        const isBlack = dilated[i] === 1;
        const color = isBlack ? 0 : 255;
        const p = i * 4;
        data[p] = color;
        data[p + 1] = color;
        data[p + 2] = color;
        data[p + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);

      // 4. Detekce a zpracování v Tesseractu
      try {
        const { data: { text } } = await worker.recognize(canvas);
        let raw = text.replace(/[^0-9.,]/g, '').trim().replace(',', '.');

        // Regex pro číslo s desetinnou tečkou
        const match = raw.match(/\d+(\.\d+)?/);
        if (match) {
          const val = match[0];
          weightInput.value = val;
          statusText.innerText = `Úspěšně načteno: ${val} g`;
        }
      } finally {
        isProcessing = false;
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
